# CI/CD para main y develop.
#  - pull_request -> solo CI (SAST + Quality Gate). Es el check requerido para hacer merge.
#  - push         -> CI + CD (imagen Docker, escaneo Trivy y publicacion en GHCR),
#                    el CD solo corre si el Quality Gate aprobo.
name: CI/CD - main & develop

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI-CD
    uses: ./.github/workflows/security-pipeline.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      codeql: true
      sca: false
      gate-title: Quality Gate - CI/CD
    secrets: inherit

  docker-build-scan-push:
    name: CD - Docker Build, Scan & Push
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Nombre de imagen en minusculas
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build de la imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de la imagen con Trivy (bloquea CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (fijado por SHA)
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Publicar imagen en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
